services:
  app:
    build:
      target: dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: sh -c "npm run migration:run && npm run start:dev"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json
    ports:
      - "3000:3000"

  postgres:
    ports:
      - "5433:5432"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
